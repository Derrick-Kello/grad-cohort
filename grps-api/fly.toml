# Deploy: fly deploy (from grps-api/). Secrets: DB_URL, DB_USER, DB_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, STORAGE_SIGNING_KEY.
app = "grad-cohort-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # demo seeds the sample graduate school on an empty database (README table). Drop it for a real rollout.
  SPRING_PROFILES_ACTIVE = "prod,demo"
  STORAGE_DIR = "/app/data/files"
  WEB_ORIGIN = "https://grad-cohort-web.fly.dev"
  FRONTEND_URL = "https://grad-cohort-web.fly.dev"
  MAIL_ENABLED = "false"
  VIRUS_SCAN_MODE = "stub"
  SCREENING_PROVIDER = "stub"

[mounts]
  source = "grps_files"
  destination = "/app/data"

# Kept running: scheduled jobs (deadlines, reminders, digests) need a live process.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health/readiness"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
